name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx prisma generate
        # Generates Prisma Client so typecheck and build have the typed query API

      - run: npm run lint

      - run: npm run typecheck

      - run: npm run test

      - run: npm run build
        env:
          # Dummy values so Zod env validation passes at build time without a real DB
          DATABASE_URL: postgresql://postup:postup@localhost:5432/postup_dev
          NEXTAUTH_SECRET: ci-secret-placeholder-min-16-chars
          NEXTAUTH_URL: http://localhost:3000
          REDIS_URL: redis://localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_BUCKET: postup
